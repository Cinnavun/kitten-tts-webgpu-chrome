<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kitten TTS WebGPU</title>
    <style>
      :root {
        --font-stack:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --text-sub: #94a3b8;
        --accent: #4f46e5;
        --accent-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        --stop-bg: #ef4444;
        --stop-hover: #dc2626;
        --success-bg: #10b981;
        --input-bg: #ffffff;
        --input-border: #cbd5e1;
        --input-focus: #6366f1;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --progress-track: #e2e8f0;
        --badge-bg: #e0e7ff;
        --badge-text: #3730a3;
      }

      [data-theme="dark"] {
        --bg: #09090b;
        --card-bg: #18181b;
        --card-border: #27272a;
        --text-main: #f8fafc;
        --text-muted: #a1a1aa;
        --text-sub: #71717a;
        --accent: #6366f1;
        --accent-gradient: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
        --stop-bg: #f87171;
        --stop-hover: #ef4444;
        --success-bg: #34d399;
        --input-bg: #121214;
        --input-border: #27272a;
        --input-focus: #818cf8;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
        --progress-track: #27272a;
        --badge-bg: #312e81;
        --badge-text: #c7d2fe;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: var(--font-stack);
        background-color: var(--bg);
        color: var(--text-main);
        padding: 12px;
        line-height: 1.45;
      }

      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--card-border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand-name {
        font-size: 14px;
        font-weight: 700;
      }
      .badge-gpu {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 9999px;
        background: var(--badge-bg);
        color: var(--badge-text);
      }

      select {
        width: 100%;
        background-color: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 8px;
        color: var(--text-main);
        font-family: inherit;
        font-size: 12px;
        outline: none;
        padding: 7px 9px;
        cursor: pointer;
      }

      select:focus {
        border-color: var(--input-focus);
      }

      .theme-select {
        width: auto;
        padding: 3px 6px;
        font-size: 11px;
        border-radius: 6px;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
        box-shadow: var(--shadow-sm);
      }

      .control-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }

      label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        margin-bottom: 4px;
      }

      textarea {
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 8px;
        color: var(--text-main);
        font-family: inherit;
        font-size: 12px;
        outline: none;
        padding: 7px 9px;
        height: 110px;
        resize: vertical;
        line-height: 1.4;
      }

      textarea:focus {
        border-color: var(--input-focus);
      }

      .textarea-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }

      .clear-btn {
        background: none;
        border: none;
        color: var(--text-sub);
        font-size: 11px;
        cursor: pointer;
      }
      .clear-btn:hover {
        color: var(--text-muted);
      }

      .slider-track {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
      }
      input[type="range"] {
        flex: 1;
        height: 5px;
        border-radius: 5px;
        background: var(--progress-track);
        outline: none;
        -webkit-appearance: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }
      .slider-pill {
        font-size: 11px;
        font-weight: 700;
        color: var(--accent);
        background: var(--badge-bg);
        padding: 2px 5px;
        border-radius: 5px;
      }
      .button-group {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      button.btn-primary,
      button.btn-danger,
      button.btn-success,
      button.btn-secondary {
        border: none;
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-primary {
        background: var(--accent-gradient);
        color: white;
        flex: 2;
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-danger {
        background-color: var(--stop-bg);
        color: white;
        flex: 1;
      }
      .btn-danger:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-secondary {
        background-color: var(--card-bg);
        border: 1px solid var(--card-border);
        color: var(--text-main);
        width: 100%;
        margin-bottom: 8px;
      }
      .btn-secondary:hover {
        background-color: var(--progress-track);
      }
      .btn-success {
        background-color: var(--success-bg);
        color: white;
        width: 100%;
        margin-top: 8px;
        display: none;
      }
      .status-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 9px 11px;
        margin-bottom: 12px;
      }
      .status-header {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-sub);
      }
      .status-dot.busy {
        background: #6366f1;
        box-shadow: 0 0 8px #6366f1;
      }
      .status-dot.playing {
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
      }
      .progress-bar-container {
        width: 100%;
        height: 6px;
        background: var(--progress-track);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 8px;
        display: none;
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.2s ease;
      }
      details.attributions {
        font-size: 11px;
        color: var(--text-muted);
        border-top: 1px solid var(--card-border);
        padding-top: 10px;
        margin-top: 10px;
      }
      details summary {
        cursor: pointer;
        font-weight: 600;
        color: var(--text-sub);
        list-style: none;
      }
      details summary:hover {
        color: var(--text-muted);
      }
      .attr-content {
        margin-top: 8px;
        padding: 8px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        line-height: 1.5;
      }
      .attr-item {
        margin-bottom: 6px;
      }
      .attr-item:last-child {
        margin-bottom: 0;
      }
      .attr-item a {
        color: var(--accent);
        text-decoration: none;
      }
      .attr-item a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="app-header">
      <div class="brand">
        <span>🐾</span>
        <div class="brand-name">Kitten TTS</div>
        <span class="badge-gpu">WebGPU</span>
      </div>
      <select id="themeSelect" class="theme-select">
        <option value="auto">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>

    <div class="card">
      <div class="control-row">
        <div>
          <label for="voiceSelect">Voice</label>
          <select id="voiceSelect">
            <option value="Jasper" selected>Jasper (M)</option>
            <option value="Bruno">Bruno (M)</option>
            <option value="Hugo">Hugo (M)</option>
            <option value="Leo">Leo (M)</option>
            <option value="Bella">Bella (F)</option>
            <option value="Luna">Luna (F)</option>
            <option value="Rosie">Rosie (F)</option>
            <option value="Kiki">Kiki (F)</option>
          </select>
        </div>
        <div>
          <label for="modelSelect">Quality</label>
          <select id="modelSelect">
            <option value="nano">Nano (24MB)</option>
            <option value="micro">Micro (41MB)</option>
            <option value="mini">Mini (78MB)</option>
          </select>
        </div>
      </div>
      <div>
        <label for="speedInput">
          <span>Speed</span>
          <span id="speedValue" class="slider-pill">1.0x</span>
        </label>
        <div class="slider-track">
          <input
            type="range"
            id="speedInput"
            min="0.5"
            max="2.0"
            step="0.1"
            value="1.0"
          />
        </div>
      </div>
    </div>

    <div class="card">
      <button id="extractArticleBtn" class="btn-secondary">
        📰 Scan & Extract Article
      </button>
      <div class="textarea-header">
        <label for="textInput" style="margin-bottom: 0">Text to Read</label>
        <button id="clearBtn" class="clear-btn">Clear</button>
      </div>
      <textarea
        id="textInput"
        placeholder="Highlight text on any page, click Scan Article, or type here..."
      ></textarea>
      <div class="button-group">
        <button id="playBtn" class="btn-primary">▶ Play Audio</button>
        <button id="stopBtn" class="btn-danger" disabled>⏹ Stop</button>
      </div>
      <button id="downloadBtn" class="btn-success">
        ⬇ Download Audio (.wav)
      </button>
    </div>

    <div class="status-card">
      <div class="status-header">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Ready</span>
      </div>
      <div id="progressContainer" class="progress-bar-container">
        <div id="progressFill" class="progress-bar-fill"></div>
      </div>
      <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
        <button id="resetGpuBtn" class="clear-btn" title="Recreates GPU worker and clears model cache">🔄 Reset Engine / Clear Cache</button>
      </div>
    </div>

    <details class="attributions">
      <summary>⚖️ Credits & Attributions</summary>
      <div class="attr-content">
        <div class="attr-item">
          <strong>kitten-tts-webgpu</strong> npm package by
          <a
            href="https://github.com/svenflow/kitten-tts-webgpu"
            target="_blank"
            rel="noopener noreferrer"
            >Svenflow</a
          >
          (MIT)
        </div>
        <div class="attr-item">
          <strong>@mozilla/readability</strong> by
          <a
            href="https://github.com/mozilla/readability"
            target="_blank"
            rel="noopener noreferrer"
            >Mozilla</a
          >
          (Apache 2.0)
        </div>
        <div class="attr-item">
          <strong>Kitten TTS</strong> by
          <a
            href="https://huggingface.co/KittenML"
            target="_blank"
            rel="noopener noreferrer"
            >KittenML</a
          >
          — original model (Apache 2.0)
        </div>
      </div>
    </details>

    <script type="module" src="dist/sidepanel.js"></script>
  </body>
</html>
